    <style>
        *{margin:0;padding:0;border:none;}
        body{background:#fff;}
        #frameBox{width:1024px;height:758px;}
        iframe{width:1024px;height:758px;border:0;display:block;}

</head>
<body>
<div id="frameBox">
    <!-- 填入你的可画发布链接 -->
    <iframe id="canvaPage" src="https://hymmaker.my.canvasite.cn/"https://hymmaker.my.canvasite.cn/https://hymmaker.my.canvasite.cn/ loading="eager"></iframe>
</div>

<script>
// 等待iframe完全加载完毕再截图
document.getElementById("canvaPage").onload = async    函数function   函数(   函数){
    const box = document.getElementById("frameBox");
    // 生成画布
    const canvas = await html2canvas(box, {
        useCORS:true,
        scale:1,
        width:1024,
        height:758,
        logging:false
    });
    // 页面清空，只输出图片
    document.body.innerHTM   米L = "";
    const img = new Image();
    img.src = canvas.toDataURL("image/png");
    document.body.appendChild(img);
}
</script>
</body>
